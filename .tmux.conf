set -g mouse on
set -g default-terminal "tmux-256color"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"

bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

if-shell -b '[ -d ${HOME}/.config/tmux/plugins/catppuccin ]' {
    # Configure the catppuccin plugin
    set -g @catppuccin_flavor "macchiato"
    set -g @catppuccin_window_status_style "rounded"

    # Load catppuccin
    run "${HOME}/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

    # Make the status line pretty and add some modules
    set -g status-right-length 100
    set -g status-left-length 100
    set -g status-left ""
    set -g status-right "#{E:@catppuccin_status_application}"
    set -agF status-right "#{E:@catppuccin_status_cpu}"
    set -agF status-right "#{E:@catppuccin_status_ram}"
    set -ag status-right "#{E:@catppuccin_status_session}"
    set -ag status-right "#{E:@catppuccin_status_uptime}"
    set -agF status-right "#{E:@catppuccin_status_battery}"
}

if-shell -b '[ -d ${HOME}/.config/tmux/plugins/tmux-cpu ]' {
    run-shell ${HOME}/.config/tmux/plugins/tmux-cpu/cpu.tmux
}
if-shell -b '[ -d ${HOME}/.config/tmux/plugins/tmux-battery ]' {
    run-shell ${HOME}/.config/tmux/plugins/tmux-battery/battery.tmux
}
